<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Copa Campeones Normandy 2026</title>
<style>
:root{
  --blue:#1a3a6b;--blue2:#2563eb;--green:#16a34a;--yellow:#ca8a04;--red:#dc2626;
  --bg:#f0f4f8;--card:#fff;--border:#e2e8f0;--dim:#64748b;--text:#1e293b;
  --radius:12px;--shadow:0 2px 8px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif;}
body{background:var(--bg);color:var(--text);min-height:100vh;}

/* LOGIN */
.lov{position:fixed;inset:0;background:linear-gradient(135deg,#1a3a6b 0%,#2563eb 100%);
  display:flex;align-items:center;justify-content:center;z-index:1000;}
.lcard{background:#fff;border-radius:20px;padding:40px 32px;width:min(360px,92vw);
  text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.lball{font-size:3rem;display:block;margin-bottom:12px;}
.lcard h1{font-size:2rem;font-weight:800;color:var(--blue);line-height:1.1;}
.lcard p{color:var(--dim);font-size:.9rem;margin:6px 0 24px;}
.lcard input{display:block;width:100%;padding:12px 16px;margin-bottom:12px;
  border:2px solid var(--border);border-radius:10px;font-size:1rem;outline:none;
  transition:border-color .2s;}
.lcard input:focus{border-color:var(--blue2);}
.lbtn{width:100%;padding:14px;background:var(--blue);color:#fff;border:none;
  border-radius:10px;font-size:1rem;font-weight:700;letter-spacing:1px;cursor:pointer;
  transition:background .2s;margin-top:4px;}
.lbtn:hover{background:var(--blue2);}
.lerr{color:var(--red);font-size:.85rem;margin-top:10px;min-height:18px;}
.hidden{display:none!important;}

/* APP */
#app{min-height:100vh;}
header{background:var(--blue);color:#fff;padding:0 16px;position:sticky;top:0;z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,.2);}
.hrow1{display:flex;align-items:center;justify-content:space-between;padding:10px 0;gap:8px;}
.hlogo{font-weight:800;font-size:1rem;white-space:nowrap;}
.hactions{display:flex;align-items:center;gap:8px;}
.hbtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);
  border-radius:8px;padding:6px 12px;font-size:.8rem;cursor:pointer;white-space:nowrap;}
.hbtn:hover{background:rgba(255,255,255,.25);}
.hconn{font-size:.75rem;color:rgba(255,255,255,.7);}
.hrow2{padding:6px 0;border-top:1px solid rgba(255,255,255,.15);font-size:.78rem;
  color:rgba(255,255,255,.8);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.bcr-sep{opacity:.5;}
.bcr-link{cursor:pointer;text-decoration:underline;opacity:.85;}
.bcr-link:hover{opacity:1;}

/* TABS */
.tabs{background:#fff;border-bottom:2px solid var(--border);padding:0 16px;
  display:flex;gap:0;position:sticky;top:56px;z-index:99;}
.tbtn{padding:12px 18px;font-size:.88rem;font-weight:600;color:var(--dim);
  border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;
  margin-bottom:-2px;transition:all .15s;}
.tbtn.active{color:var(--blue);border-bottom-color:var(--blue);}
.tbtn:hover{color:var(--blue);}

/* MAIN CONTENT */
#mv{padding:16px;max-width:900px;margin:0 auto;}
.loading{text-align:center;padding:60px 20px;color:var(--dim);}
.spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue2);
  border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.errbox{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:14px 18px;
  color:var(--red);font-size:.9rem;margin-bottom:16px;}

/* CARDS */
.statsrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px;}
.scard{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);text-align:center;}
.sv{font-size:1.5rem;font-weight:800;}
.sv.blue{color:var(--blue);}
.sv.green{color:var(--green);}
.sv.yellow{color:var(--yellow);}
.sv.red{color:var(--red);}
.sl{font-size:.72rem;color:var(--dim);margin-top:2px;}
.ss{font-size:.68rem;color:var(--dim);margin-top:2px;}

.sec-hdr{font-size:.7rem;font-weight:700;color:var(--dim);text-transform:uppercase;
  letter-spacing:1.5px;margin:20px 0 10px;}
.avbar{background:var(--card);border-radius:var(--radius);padding:14px 18px;
  box-shadow:var(--shadow);margin-bottom:16px;display:flex;align-items:center;gap:12px;}

/* GROUP CARDS */
.ggroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:20px;}
.gcard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  cursor:pointer;overflow:hidden;transition:box-shadow .2s;}
.gcard:hover{box-shadow:0 6px 20px rgba(0,0,0,.12);}
.gcard-top{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 14px 10px;}
.gcard-name{font-weight:800;font-size:1rem;color:var(--blue);}
.gtag{background:var(--blue);color:#fff;font-size:.65rem;font-weight:700;
  border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle;}
.gcard-sub{font-size:.75rem;color:var(--dim);margin-top:3px;}
.gpct{font-size:1.5rem;font-weight:800;white-space:nowrap;}
.gpct.green{color:var(--green);}
.gpct.yellow{color:var(--yellow);}
.gpct.red{color:var(--red);}
.gstats3{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:0 14px 12px;}
.gs{text-align:center;padding:6px 4px;border-right:1px solid var(--border);}
.gs:last-child{border-right:none;}
.gsv{font-size:1rem;font-weight:700;color:var(--text);}
.gsv.b{color:var(--blue);}
.gsl{font-size:.65rem;color:var(--dim);margin-top:2px;}
.gem{display:flex;align-items:center;gap:8px;padding:8px 14px;
  border-top:1px solid var(--border);background:#f8fafc;}
.gemv{font-size:1rem;font-weight:800;color:var(--blue);}
.geml{font-size:.72rem;font-weight:600;}
.gcard-foot{display:flex;justify-content:space-between;padding:10px 14px;
  font-size:.78rem;color:var(--blue2);font-weight:600;border-top:1px solid var(--border);}

/* VENDOR ROWS */
.vtable{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;}
.vtrow{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;gap:10px;}
.vtrow:last-child{border-bottom:none;}
.vtrow:hover{background:#f8fafc;}
.vtname{font-weight:700;font-size:.9rem;min-width:80px;}
.vtpct{font-size:1.1rem;font-weight:800;text-align:right;min-width:52px;}
.vtpct.green{color:var(--green);}
.vtpct.yellow{color:var(--yellow);}
.vtpct.red{color:var(--red);}
.vtbar-wrap{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.vtbar{height:100%;border-radius:3px;transition:width .4s;}
.vtbar.green{background:var(--green);}
.vtbar.yellow{background:var(--yellow);}
.vtbar.red{background:var(--red);}
.vtmeta{font-size:.72rem;color:var(--dim);min-width:60px;text-align:right;}

/* CLIENT TABLE */
.ctbl{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.ctbl-hdr,.ctbl-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:0;}
.ctbl-hdr{padding:10px 14px;background:#f8fafc;font-size:.72rem;font-weight:700;
  color:var(--dim);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);}
.ctbl-row{padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;align-items:center;}
.ctbl-row:last-child{border-bottom:none;}
.ctbl-row:hover{background:#f8fafc;}
.ctbl-name{font-size:.83rem;font-weight:600;}
.ctbl-cod{font-size:.7rem;color:var(--dim);}
.ctbl-num{font-size:.85rem;text-align:right;}
.ctbl-pct{font-size:.85rem;font-weight:700;text-align:right;}
.ctbl-pct.green{color:var(--green);}
.ctbl-pct.yellow{color:var(--yellow);}
.ctbl-pct.red{color:var(--red);}
.csearch{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:10px;
  font-size:.9rem;outline:none;margin-bottom:12px;}
.csearch:focus{border-color:var(--blue2);}

/* CLIENT DETAIL */
.cdbrand-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px;}
.cdbrand{background:var(--card);border-radius:var(--radius);padding:14px;
  box-shadow:var(--shadow);text-align:center;}
.cdico{font-size:1.6rem;}
.cdname{font-size:.72rem;font-weight:700;color:var(--dim);text-transform:uppercase;margin:4px 0;}
.cdpct{font-size:1.4rem;font-weight:800;}
.cdpct.green{color:var(--green);}
.cdpct.yellow{color:var(--yellow);}
.cdpct.red{color:var(--red);}
.cdnums{font-size:.72rem;color:var(--dim);margin-top:2px;}
.cdbadge{display:inline-block;background:#fef9c3;color:#854d0e;font-size:.68rem;
  font-weight:700;border-radius:4px;padding:2px 6px;margin-top:4px;}
.sembar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.sbtn{padding:6px 14px;border:2px solid var(--border);border-radius:20px;
  background:#fff;font-size:.8rem;cursor:pointer;font-weight:600;color:var(--dim);}
.sbtn.active{background:var(--blue);color:#fff;border-color:var(--blue);}

/* RANKING */
.rtbl{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;}
.rtbl-hdr{display:grid;grid-template-columns:40px 1fr repeat(6,50px) 60px;gap:0;
  padding:10px 14px;background:#f8fafc;font-size:.68rem;font-weight:700;
  color:var(--dim);text-transform:uppercase;border-bottom:1px solid var(--border);}
.rtbl-row{display:grid;grid-template-columns:40px 1fr repeat(6,50px) 60px;gap:0;
  padding:11px 14px;border-bottom:1px solid var(--border);align-items:center;}
.rtbl-row:last-child{border-bottom:none;}
.rtbl-row.eligible{background:#f0fdf4;}
.rpos{font-size:1rem;font-weight:800;color:var(--blue);}
.rname{font-size:.83rem;font-weight:600;}
.rgrp{font-size:.68rem;color:var(--dim);}
.rbr{font-size:.8rem;text-align:right;}
.rbr.green{color:var(--green);}
.rbr.yellow{color:var(--yellow);}
.rbr.red{color:var(--red);}
.rtot{font-size:.92rem;font-weight:800;text-align:right;}
.rtot.green{color:var(--green);}
.rtot.yellow{color:var(--yellow);}
.rtot.red{color:var(--red);}
.rfilters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.rfbtn{padding:6px 14px;border:2px solid var(--border);border-radius:20px;
  background:#fff;font-size:.8rem;cursor:pointer;font-weight:600;color:var(--dim);}
.rfbtn.active{background:var(--blue);color:#fff;border-color:var(--blue);}

/* CÓMO PARTICIPAR */
.cpcard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:20px;margin-bottom:14px;}
.cpcard h3{color:var(--blue);font-size:1rem;margin-bottom:10px;}
.cpcard p,.cpcard li{font-size:.88rem;line-height:1.6;color:var(--text);}
.cpcard ul,.cpcard ol{padding-left:18px;margin-top:6px;}
.cpcard li{margin-bottom:4px;}
.brand-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.brand-pill{background:#e0f2fe;color:#0369a1;border-radius:20px;padding:4px 12px;font-size:.8rem;font-weight:600;}

/* MODAL */
.modov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;
  display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;}
.modcard{background:#fff;border-radius:16px;padding:24px;width:min(560px,96vw);margin:auto;}
.modcard h2{color:var(--blue);margin-bottom:16px;}
.modclose{float:right;background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--dim);}
.modmsg{font-size:.85rem;margin-top:8px;padding:6px 10px;border-radius:6px;}
.modmsg.ok{background:#dcfce7;color:#166534;}
.modmsg.err{background:#fee2e2;color:#991b1b;}

@media(max-width:600px){
  .rtbl-hdr,.rtbl-row{grid-template-columns:30px 1fr repeat(2,50px) 60px;}
  .rtbl-hdr>*:nth-child(n+4):nth-child(-n+8),
  .rtbl-row>*:nth-child(n+4):nth-child(-n+8){display:none;}
  .ctbl-hdr,.ctbl-row{grid-template-columns:2fr 1fr 1fr;}
  .ctbl-hdr>*:nth-child(2),.ctbl-row>*:nth-child(2){display:none;}
  .tabs .tbtn{padding:10px 10px;font-size:.8rem;}
  .hlogo{font-size:.88rem;}
}
</style>
</head>

}
function monthAvp(preventa) {
  var now = new Date(); now.setHours(0,0,0,0);
  var s = new Date(2026,5,1), e = new Date(2026,5,28);
  var tot = daysWorked(s, e, preventa);
  var yest = new Date(now); yest.setDate(yest.getDate()-1);
  var elapsed = yest < s ? 0 : (yest > e ? tot : daysWorked(s, yest, preventa));
  return { pct: tot>0?Math.round(elapsed/tot*100):0, el: elapsed, tot: tot };
}
function semAvp(sk, preventa) {
  var sd = SD[sk]; if (!sd) return 0;
  var now = new Date(); now.setHours(0,0,0,0);
  if (now < sd.s) return 0;
  if (now > sd.e) return 100;
  var tot = daysWorked(sd.s, sd.e, preventa);
  var yest = new Date(now); yest.setDate(yest.getDate()-1);
  var el = daysWorked(sd.s, yest < sd.s ? sd.s : yest, preventa);
  return tot > 0 ? Math.round(el/tot*100) : 0;
}
function semsLoaded() {
  return SEMS.filter(function(s) {
    return ventas[s] && Object.keys(ventas[s]).length > 0;
  }).length || 1;
}
function semsLabel() {
  return semsLoaded() < 4 ? 'Acum. ('+semsLoaded()+'/4 sem)' : 'Meta Mensual';
}

// ── PARSE CSV ──
function parseCSV(txt) {
  if (!txt) return false;
  var lines = txt.split(/\r?\n/).filter(function(l) { return l.trim(); });
  if (lines.length < 2) return false;
  var newMetas = {}, newVentas = {};
  var hasMetas = false;
  for (var i = 1; i < lines.length; i++) {
    var cols = lines[i].split(',');
    if (cols.length < 17) continue;
    var grupo  = (cols[0]||'').trim();
    var vend   = (cols[1]||'').trim();
    var cod    = (cols[2]||'').trim();
    var nombre = (cols[3]||'').trim();
    var sem    = (cols[17]||'').trim() || 'Sem 1';
    if (!cod) continue;
    if (!newMetas[cod]) {
      newMetas[cod] = {
        grupo:grupo, vendedor:vend, cod:cod, nombre:nombre,
        meta_gourmet:+cols[4]||0, meta_cocadas:+cols[6]||0,
        meta_pomgur:+cols[8]||0,  meta_cosmic:+cols[10]||0,
        meta_yomax:+cols[12]||0,  meta_arequipe:+cols[14]||0
      };
      hasMetas = true;
    }
    if (!newVentas[sem]) newVentas[sem] = {};
    newVentas[sem][cod] = {
      venta_gourmet:+cols[5]||0,  venta_cocadas:+cols[7]||0,
      venta_pomgur:+cols[9]||0,   venta_cosmic:+cols[11]||0,
      venta_yomax:+cols[13]||0,   venta_arequipe:+cols[15]||0
    };
  }
  if (!hasMetas) return false;
  metas = newMetas; ventas = newVentas;
  loaded = Object.keys(metas).length > 0;
  vendCache = {}; viewHtmlCache = {};
  return loaded;
}

function parseVendedorCSV(txt) {
  if (!txt) return false;
  var lines = txt.split(/\r?\n/).filter(function(l) { return l.trim(); });
  if (lines.length < 2) return false;
  var newVV = {};
  for (var i = 1; i < lines.length; i++) {
    var cols = lines[i].split(',');
    if (cols.length < 8) continue;
    var vend = (cols[1]||'').trim();
    if (!vend) continue;
    newVV[vend] = {
      gourmet:+cols[2]||0, cocadas:+cols[3]||0, pomgur:+cols[4]||0,
      cosmic:+cols[5]||0,  yomax:+cols[6]||0,   arequipe:+cols[7]||0
    };
  }
  if (Object.keys(newVV).length === 0) return false;
  ventasVend = newVV;
  return true;
}

// ── METRICS ──
function cliVenta(cod, sem) {
  if (sem === 'Total') {
    var tot = {};
    SEMS.forEach(function(s) {
      var sv = ventas[s] && ventas[s][cod] ? ventas[s][cod] : {};
      BR.forEach(function(b) { tot['venta_'+b] = (tot['venta_'+b]||0) + (sv['venta_'+b]||0); });
    });
    return tot;
  }
  return (ventas[sem] && ventas[sem][cod]) ? ventas[sem][cod] : {};
}

function cliMeta(cod) { return metas[String(cod)] || null; }

function cliCumpl(cod) {
  var m = cliMeta(cod); if (!m) return null;
  var totM = 0, totV = 0, allOk = true;
  var sv = cliVenta(cod,'Total');
  BR.forEach(function(b) {
    var meta = (m['meta_'+b]||0) * semsLoaded();
    var vta  = sv['venta_'+b]||0;
    totM += meta; totV += vta;
    if (meta > 0 && vta < meta) allOk = false;
  });
  var pct = totM > 0 ? Math.round(totV/totM*100) : 0;
  return { pct:pct, totM:totM, totV:totV, eligible:(totM>0&&allOk) };
}

function grpMx(grupo, clients) {
  var gM = 0, gV = 0, gE = 0;
  var ip = grupo.startsWith('P_');
  var avObj = monthAvp(ip);
  clients.forEach(function(c) {
    BR.forEach(function(b) { gM += (c['meta_'+b]||0)*4; });
    var cc = cliCumpl(c.cod); if (cc && cc.eligible) gE++;
  });
  var vds = Array.from(new Set(clients.map(function(c){return c.vendedor;})));
  vds.forEach(function(v) {
    var vv = ventasVend[v] || {};
    BR.forEach(function(b) { gV += vv[b]||0; });
  });
  var cumpl = gM > 0 ? Math.round(gV/gM*100) : 0;
  var falt  = Math.max(0, gM - gV);
  return { gM:gM, gV:gV, gE:gE, cumpl:cumpl, avp:avObj.pct, avEl:avObj.el, avTot:avObj.tot, falt:falt, ip:ip };
}

function vendMx(vend) {
  var clients = Object.values(metas).filter(function(m){return m.vendedor===vend;});
  if (!clients.length) return null;
  var ip = clients[0].grupo.startsWith('P_');
  var avObj = monthAvp(ip);
  var vM = 0;
  clients.forEach(function(c) {
    BR.forEach(function(b) { vM += (c['meta_'+b]||0)*4; });
  });
  var vv = ventasVend[vend] || {};
  var vV = 0; BR.forEach(function(b) { vV += vv[b]||0; });
  var cumpl  = vM > 0 ? Math.round(vV/vM*100) : 0;
  var allOk  = BR.every(function(b) { return vM<=0||(vv[b]||0)>=0; });// >=meta check in ranking
  var brData = BR.map(function(b,i) {
    var bm = clients.reduce(function(s,c){return s+(c['meta_'+b]||0)*4;},0);
    var bv = vv[b]||0;
    var bp = bm>0?Math.round(bv/bm*100):0;
    return {b:b,label:BL[i],ico:BICO[i],meta:bm,vta:bv,pct:bp};
  });
  return { vend:vend, cumpl:cumpl, vM:vM, vV:vV, avp:avObj.pct, brData:brData, grupo:clients[0].grupo, clients:clients };
}

function vendMxCached(vend) {
  if (!vendCache[vend]) vendCache[vend] = vendMx(vend);
  return vendCache[vend];
}

function precomputeAdmin() {
  var vds = Array.from(new Set(Object.values(metas).map(function(m){return m.vendedor;})));
  vds.forEach(function(v) { if (!vendCache[v]) vendCache[v] = vendMx(v); });
}

      curCliSem = this.getAttribute('data-sem');
      renderClient(el);
    };
  });
}

// ── RANKING ──
function renderRanking() {
  var el = document.getElementById('trank'); if (!el) return;
  if (!loaded) { el.innerHTML='<div class="errbox">Sin datos disponibles.</div>'; return; }
  var rol = curU.rol, scope = curU.scope;
  var grupos = rol==='Admin' ? ['Canal','A_TAT','P_PER','P_MZL'] : null;
  var useGrupos = rol==='Admin'
    ? (rankFilter==='Canal'?['A_TAT','P_PER','P_MZL']:[rankFilter])
    : [scope.indexOf('_')>0?scope.replace(/[0-9]+$/,''):scope];
  // for Coordinadores, use their group
  if (rol==='Coordinador') useGrupos=[scope];
  // for Vendedores, use their group
  if (rol==='Vendedor') {
    var mc=Object.values(metas).find(function(m){return m.vendedor===scope;});
    useGrupos=[mc?mc.grupo:'A_TAT'];
  }
  var vds = Array.from(new Set(
    Object.values(metas)
      .filter(function(m){return useGrupos.indexOf(m.grupo)>=0;})
      .map(function(m){return m.vendedor;})
  ));
  var rows = vds.map(function(v) { return vendMxCached(v); }).filter(Boolean);
  // eligible = all brands ≥ 100% cumpl
  rows.forEach(function(r) {
    r.eligible = r.brData.every(function(bd){return bd.meta<=0||bd.pct>=100;});
  });
  rows.sort(function(a,b) {
    if (a.eligible!==b.eligible) return a.eligible?-1:1;
    return b.cumpl-a.cumpl;
  });
  var html = '';
  if (rol==='Admin') {
    html += '<div class="rfilters">';
    grupos.forEach(function(g) {
      html += '<button class="rfbtn'+(rankFilter===g?' active':'')+'" data-rg="'+g+'">'+g+'</button>';
    });
    html += '</div>';
  }
  html += '<div class="rtbl">'
    +'<div class="rtbl-hdr"><div>#</div><div>Vendedor</div>'
    +BR.map(function(b,i){return '<div>'+BL[i].slice(0,3)+'</div>';}).join('')
    +'<div style="text-align:right">Total</div></div>';
  rows.forEach(function(r,i) {
    var ip = r.grupo.startsWith('P_');
    var av = monthAvp(ip).pct;
    html += '<div class="rtbl-row'+(r.eligible?' eligible':'')+'">'
      +'<div class="rpos">'+(r.eligible?'🏆':i+1)+'</div>'
      +'<div><div class="rname">'+r.vend+'</div><div class="rgrp">'+r.grupo+'</div></div>'
      +r.brData.map(function(bd){
        var cl=bd.meta>0?clr(bd.pct,av):'green';
        return '<div class="rbr '+cl+'">'+bd.pct+'%</div>';
      }).join('')
      +'<div class="rtot '+clr(r.cumpl,av)+'">'+r.cumpl+'%</div>'
      +'</div>';
  });
  html += '</div>';
  el.innerHTML = html;
  el.querySelectorAll('.rfbtn[data-rg]').forEach(function(btn) {
    btn.onclick = function() { rankFilter=this.getAttribute('data-rg'); renderRanking(); };
  });
}

// ── CÓMO PARTICIPAR ──

  el.innerHTML = '<div class="cpcard"><h3>🏆 Premio</h3>'

    +'<div class="cpcard"><h3>📦 Marcas participantes</h3>'
    +'<div class="brand-pills">'+BL.map(function(b,i){return '<span class="brand-pill">'+BICO[i]+' '+b+'</span>';}).join('')+'</div></div>'
    +'<div class="cpcard"><h3>📅 Período</h3>'
    +'<p>Junio 2026 · 4 semanas · Del 1 al 28 de junio.</p>'
    +'<p style="margin-top:6px">Grupos A_TAT: lunes a viernes · Grupos P_: lunes a sábado.</p></div>'

    +'<li>Las ventas se registran acumuladas en Google Sheets (Hoja 2).</li>'

    +'<span style="color:var(--yellow)">🟡 Amarillo</span> = 1–5pts abajo · '

// ── LOGIN / LOGOUT ──
function doLogin() {
  var lerr = document.getElementById('lerr');
  var u = document.getElementById('lu').value.trim();
  var p = document.getElementById('lp').value;
  if (!u || !p) { if(lerr) lerr.textContent='Completa usuario y contraseña.'; return; }
  var usr = USERS[u];
  if (!usr || usr.pwd !== p) { if(lerr) lerr.textContent='Usuario o contraseña incorrectos.'; return; }
  curU = { user:u, rol:usr.rol, scope:usr.scope };
  document.getElementById('lov').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('ubadge') && (document.getElementById('ubadge').textContent = u+' ('+usr.rol+')');
  if (usr.rol==='Admin') document.getElementById('abtn').classList.remove('hidden');
  if (usr.rol==='Admin') curView='home';
  else if (usr.rol==='Coordinador') { curView='group'; curGroup=usr.scope; }
  else {
    curView='route'; curVend=usr.scope;
    var mc=Object.values(metas).find(function(m){return m.vendedor===usr.scope;});
    if(mc) curGroup=mc.grupo;
  }
  document.getElementById('mv').innerHTML='<div class="loading"><div class="spin"></div><br>Cargando datos de Google Sheets...</div>';
  fetchAll().then(function(){ renderView(); });
}

function doLogout() {
  curU=null; loaded=false; metas={}; ventas={}; ventasVend={};
  vendCache={}; viewHtmlCache={}; curView='home'; curGroup=null; curVend=null; curCod=null;
  document.getElementById('lov').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('lu').value='';
  document.getElementById('lp').value='';
  document.getElementById('abtn').classList.add('hidden');
}

// ── ADMIN ──
function openAdmin() {
  var tbody = document.getElementById('pwd-tbody');
  if (tbody) {
    tbody.innerHTML = Object.entries(USERS).map(function(kv) {
      var u=kv[0], v=kv[1];
      return '<tr style="border-bottom:1px solid var(--border)">'
        +'<td style="padding:6px 10px;color:var(--dim);font-size:.78rem">'+v.rol+'</td>'
        +'<td style="padding:6px 10px;font-weight:600">'+u+'</td>'
        +'<td style="padding:6px 10px"><input id="pwd_'+u+'" type="text" value="'+v.pwd+'" style="width:110px;padding:4px 8px;border:1.5px solid var(--border);border-radius:5px;font-size:.85rem"></td>'
        +'<td style="padding:6px 10px"><button data-u="'+u+'" class="savepwd-btn" style="padding:4px 10px;background:var(--blue);color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:.8rem">Guardar</button></td>'
        +'</tr>';
    }).join('');
    tbody.querySelectorAll('.savepwd-btn').forEach(function(btn) {
      btn.onclick = function() {
        var u = this.getAttribute('data-u');
        var inp = document.getElementById('pwd_'+u);
        if (inp && inp.value.trim()) {
          USERS[u].pwd = inp.value.trim();
          var msg = document.getElementById('pmsg');
          if (msg) { msg.className='modmsg ok'; msg.textContent='✅ Contraseña de '+u+' actualizada.'; }
        }
      };
    });
  }
  document.getElementById('amod').classList.remove('hidden');
}
function closeAdmin() { document.getElementById('amod').classList.add('hidden'); }

function downloadHTML() {
  if (USERS_TAG) USERS_TAG.textContent = JSON.stringify(USERS);
  var src = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  var blob = new Blob([src], {type:'text/html;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href=url; a.download='CopaCampeonesNormandy.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}

function refreshSheets() {
  setConn(false,'Recargando...');
  vendCache={}; viewHtmlCache={};
  fetchAll();
}

// ── INIT ──
document.addEventListener('DOMContentLoaded', function() {
  // Login button
  document.getElementById('lbtn').addEventListener('click', doLogin);
  document.getElementById('lp').addEventListener('keydown', function(e) { if(e.key==='Enter') doLogin(); });
  document.getElementById('lu').addEventListener('keydown', function(e) { if(e.key==='Enter') document.getElementById('lp').focus(); });
  // Logout
  document.getElementById('logout-btn').addEventListener('click', doLogout);
  // Tabs
  document.getElementById('tab-seg').addEventListener('click',  function(){switchTab('seg');});
  document.getElementById('tab-rank').addEventListener('click', function(){switchTab('rank');});
  document.getElementById('tab-cp').addEventListener('click',   function(){switchTab('cp');});
  // Admin
  document.getElementById('abtn').addEventListener('click', openAdmin);
  document.getElementById('amod-close').addEventListener('click', closeAdmin);
  // CSV file
  document.getElementById('csvf').addEventListener('change', function() {
    var f=this.files[0]; if(!f) return;
    var st=document.getElementById('csvs');
    if(st) st.textContent='Leyendo...';
    var reader=new FileReader();
    reader.onload=function(e) {
      var ok=parseCSV(e.target.result);
      if(ok) { if(st){st.style.color='var(--green)';st.textContent='✅ Cargado';} setConn(true,'CSV'); renderView(); renderRanking(); }
      else   { if(st){st.style.color='var(--red)';st.textContent='❌ Error';} }
    };
    reader.readAsText(f);
  });
});

})();
</script>
